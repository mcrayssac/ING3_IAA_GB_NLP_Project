# OpenJev upgrade round U1 (task 3.4, post hoc). The same model, helper, pins and readout as
# configs/openjev.toml; only the CALL question changes. See docs/openjev.md, "Upgrade round U1".

# The server runs from its own environment, bound to loopback.
[server]
python = "~/openjev/mlx/bin/python"
host = "127.0.0.1"
port = 3000
start_timeout_seconds = 300
request_timeout_seconds = 300

# The CALL question only, asked in the 3 cyclic orders of `options` and averaged per label.
# Each option carries a description made of p01 clauses, written before any U1 run.
[questions.call]
type = "choice"
instructions = "Which call does the policy give in reply to the latest user message?"
options = ["BOX", "STAY OUT", "NO CALL"]
orders = 3

[questions.call.descriptions]
BOX = "A pit opportunity exists under the ordered policy (tyre age at or above the second limit, whatever the gap ahead, or between the two limits with a known gap ahead of 2.0 seconds or less), and there is no car behind or its known gap covers the pit-loss estimate plus 2.0 seconds."
"STAY OUT" = "The ordered policy gives no stop: tyre age below the first limit; between the two limits, a gap ahead above 2.0 seconds or no car ahead; or a known car behind too close to cover the pit loss plus 2.0 seconds."
"NO CALL" = "A field the ordered branch needs is missing or invalid, the race is not green-flag, dry and supported, or the request is outside the tool's scope."

