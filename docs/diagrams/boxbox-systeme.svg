<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1000" viewBox="0 0 1220 1000" role="img"><title>BoxBox - système prévu</title><desc>Données historiques séparées par course avant génération ; adaptation A/B et évaluation ; moteur de conversation partagé.</desc><rect width="100%" height="100%" fill="white"/><text x="36" y="38.02" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="14">BOXBOX / SYSTÈME</text><text x="36" y="85.62" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="34">Des données à une réponse expliquée</text><text x="36" y="118.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Conception prévue · Cadrage documentaire existant · Aucun composant applicatif validé dans l’audit fourni</text><text x="36" y="173.88" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="16">01  DONNÉES ET CORPUS</text><rect x="36" y="195" width="340" height="128" rx="12" fill="#e4f1ff" stroke="#438bd1" stroke-width="1.4"/><text x="56" y="230.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">FastF1 → cartes</text><text x="56" y="260.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Historique sec · données antérieures</text><text x="56" y="282.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">au tour · règles explicites</text><rect x="440" y="195" width="340" height="128" rx="12" fill="#e4f1ff" stroke="#438bd1" stroke-width="1.4"/><text x="460" y="230.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Séparer les courses</text><text x="460" y="260.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Train / validation / mini-test / final</text><text x="460" y="282.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Avant la génération des dialogues</text><rect x="844" y="195" width="340" height="128" rx="12" fill="#e4f1ff" stroke="#438bd1" stroke-width="1.4"/><text x="864" y="230.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Corpus A / B</text><text x="864" y="260.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">400 chacun · 340 communs</text><text x="864" y="282.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">60 variantes NO CALL dans B</text><polyline points="384,260 431,260" fill="none" stroke="#607086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="423.79642318117857,263.4797242728898 431,260 423.79642318117857,256.5202757271102" fill="none" stroke="#607086" stroke-width="1.8"/><polyline points="788,260 835,260" fill="none" stroke="#607086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="827.7964231811786,263.4797242728898 835,260 827.7964231811786,256.5202757271102" fill="none" stroke="#607086" stroke-width="1.8"/><text x="36" y="356.88" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="16">M1.1 fixe carte, seuils, oracle et format. M2.1–M2.2 assurent provenance, absence de fuite et relecture.</text><text x="36" y="419.88" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="16">02  MODÈLES ET ÉVALUATION</text><rect x="36" y="443" width="340" height="145" rx="12" fill="#eee7ff" stroke="#8d6ace" stroke-width="1.4"/><text x="56" y="478.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Baseline + adaptateurs A / B</text><text x="56" y="508.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">LoRA ou QLoRA · base gelée</text><text x="56" y="530.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">A/B : mêmes base, graine et réglages</text><text x="56" y="551.31" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Baseline sans entraînement</text><rect x="440" y="443" width="340" height="145" rx="12" fill="#eee7ff" stroke="#8d6ace" stroke-width="1.4"/><text x="460" y="478.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Validation puis mini-test</text><text x="460" y="508.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Sélection sur validation</text><text x="460" y="530.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Exploration sur ≥20 cas</text><text x="460" y="551.31" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Analyse A/B puis gel le 20/10</text><rect x="844" y="443" width="340" height="145" rx="12" fill="#e0f5ec" stroke="#329c78" stroke-width="1.4"/><text x="864" y="478.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Final après gel</text><text x="864" y="508.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">~200 cas · 40 cas humains / version</text><text x="864" y="530.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Baseline, A et B · cinq axes</text><text x="864" y="551.31" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Différences et IC par course</text><polyline points="384,510 431,510" fill="none" stroke="#607086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="423.79642318117857,513.4797242728898 431,510 423.79642318117857,506.5202757271102" fill="none" stroke="#607086" stroke-width="1.8"/><polyline points="788,510 835,510" fill="none" stroke="#607086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="827.7964231811786,513.4797242728898 835,510 827.7964231811786,506.5202757271102" fill="none" stroke="#607086" stroke-width="1.8"/><text x="36" y="621.88" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="16">Train → adaptation · Validation → sélection · Mini-test → exploration · Final → mesure indépendante après gel</text><text x="36" y="684.88" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="16">03  CONVERSATION</text><rect x="36" y="707" width="340" height="145" rx="12" fill="#edf0f4" stroke="#718096" stroke-width="1.4"/><text x="56" y="742.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Gradio dans le notebook</text><text x="56" y="772.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Carte visible + message + historique</text><text x="56" y="794.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Suivis · reset · changement de carte</text><text x="56" y="815.31" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Rôle et limites affichés</text><rect x="440" y="707" width="340" height="145" rx="12" fill="#edf0f4" stroke="#718096" stroke-width="1.4"/><text x="460" y="742.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Moteur partagé</text><text x="460" y="772.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Template natif · contexte borné</text><text x="460" y="794.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Baseline ou adaptateur chargé</text><text x="460" y="815.31" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Carte et historique transmis</text><rect x="844" y="707" width="340" height="145" rx="12" fill="#edf0f4" stroke="#718096" stroke-width="1.4"/><text x="864" y="742.53" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="21">Deux lignes en anglais</text><text x="864" y="772.81" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">CALL: BOX / STAY OUT / NO CALL</text><text x="864" y="794.06" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">WHY: une phrase fondée sur la carte</text><text x="864" y="815.31" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17">Aucune valeur inventée</text><polyline points="384,778 431,778" fill="none" stroke="#607086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="423.79642318117857,781.4797242728898 431,778 423.79642318117857,774.5202757271102" fill="none" stroke="#607086" stroke-width="1.8"/><polyline points="788,778 835,778" fill="none" stroke="#607086" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="827.7964231811786,781.4797242728898 835,778 827.7964231811786,774.5202757271102" fill="none" stroke="#607086" stroke-width="1.8"/><rect x="36" y="895" width="1148" height="64" rx="12" fill="#f7f9fb" stroke="#e8edf2" stroke-width="1"/><text x="54" y="924.6" fill="#243247" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="20">Une politique explicable, pas une stratégie optimale réelle.</text><text x="54" y="948.88" fill="#607086" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="16">Versions, accès FastF1, matériel et faisabilité à confirmer en M1.1 / M1.2 / M2.1.</text></svg>