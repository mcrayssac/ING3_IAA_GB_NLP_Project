<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxBox Review Sheet</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #66665f; --line: #deded8;
  --accent: #1f5fbf; --ok: #217a3c; --warn: #a15c00; --bad: #b3261e; --code: #f0f0ec;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #20201e; --text: #ececea; --muted: #a3a39c; --line: #3a3a36;
    --accent: #7aa7ff; --ok: #5cc27a; --warn: #e0a24a; --bad: #ff7b72; --code: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
header label { color: var(--muted); }
input, select, textarea, button { font: inherit; color: inherit; }
input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
textarea { width: 100%; min-height: 44px; resize: vertical; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }
nav { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 56px); position: sticky; top: 56px; }
nav .filters { padding: 8px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
nav ol { list-style: none; margin: 0; padding: 0; }
nav li { padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: center; }
nav li.active { background: var(--code); }
nav li small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line); }
.dot.completed { background: var(--ok); } .dot.draft { background: var(--warn); } .dot.flag { outline: 2px solid var(--bad); outline-offset: 1px; }
section.row { padding: 16px; max-width: 1100px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.box h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
table.kv { border-collapse: collapse; width: 100%; } table.kv td { padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv td:first-child { color: var(--muted); width: 45%; }
pre { background: var(--code); padding: 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
.ws { color: var(--bad); }
.turn { margin: 4px 0; } .turn b { color: var(--muted); }
.axis { border-top: 1px solid var(--line); padding: 8px 0; }
.axis .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.axis .scores label { margin-right: 10px; }
.rubric { color: var(--muted); font-size: 12px; margin: 4px 0; }
.suggest { border-left: 3px solid var(--accent); padding-left: 8px; color: var(--muted); font-size: 13px; margin: 4px 0; }
.msg { padding: 6px 10px; border-radius: 6px; margin: 6px 0; }
.msg.error { background: color-mix(in srgb, var(--bad) 15%, transparent); }
.msg.info { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.flags label { display: inline-block; margin-right: 12px; }
.status { font-weight: 600; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } nav { position: static; max-height: 40vh; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>BoxBox 4.3 review</h1>
  <span id="progress"></span>
  <label>Your name/ID <input type="text" id="rater" size="18" autocomplete="off"></label>
  <label>Mode <select id="mode"><option value="primary">Primary rating</option><option value="second">Second review</option></select></label>
  <button id="load">Load sheet CSV…</button><input type="file" id="file" accept=".csv,text/csv" hidden>
  <button id="export" class="primary">Export CSV</button>
</header>
<div id="notice"></div>
<main>
  <nav>
    <div class="filters">
      <select id="filter">
        <option value="all">All rows</option><option value="pending">Pending</option>
        <option value="completed">Completed</option><option value="sensitive">Needs second review</option>
      </select>
      <input type="text" id="search" placeholder="Filter by case or review ID">
    </div>
    <ol id="list"></ol>
  </nav>
  <section class="row" id="view"></section>
</main>

<script id="boxbox-data" type="application/json">/*BOXBOX_DATA*/null</script>

<script id="boxbox-core">
(function () {
  "use strict";
  const AXES = ["correctness", "role_format", "history", "scope", "factuality"];
  const IMMUTABLE = ["review_id", "case_id", "turn_index", "version_code", "protocol_version",
    "rating_phase", "card_json", "history_json", "message", "reference_json",
    "applicability_json", "generation_status", "raw_response", "error_json"];

  function parseCSV(text) {
    const rows = []; let row = [], field = "", i = 0, quoted = false;
    while (i < text.length) {
      const c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } quoted = false; i++; continue; }
        field += c; i++; continue;
      }
      if (c === '"' && field === "") { quoted = true; i++; continue; }
      if (c === ",") { row.push(field); field = ""; i++; continue; }
      if (c === "\r" || c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
        i += (c === "\r" && text[i + 1] === "\n") ? 2 : 1; continue;
      }
      field += c; i++;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function quote(value) {
    return /[",\r\n]/.test(value) ? '"' + value.replace(/"/g, '""') + '"' : value;
  }

  function toCSV(columns, rows) {
    const lines = [columns.map(quote).join(",")];
    for (const row of rows) lines.push(columns.map(c => quote(row[c] ?? "")).join(","));
    return lines.join("\r\n") + "\r\n";
  }

  function records(columns, text) {
    const table = parseCSV(text);
    const header = table.shift();
    if (!header || header.join("\u0000") !== columns.join("\u0000")) throw new Error("columns differ from the exported review sheet");
    return table.map(cells => {
      if (cells.length !== columns.length) throw new Error("a row has the wrong number of fields");
      return Object.fromEntries(columns.map((c, k) => [c, cells[k]]));
    });
  }

  function merge(base, loaded) {
    // Immutable inputs must match exactly; annotations fill pending rows, conflicts are reported.
    const index = new Map(base.map(r => [r.review_id, r]));
    if (loaded.length !== base.length) throw new Error("the loaded sheet has a different number of rows");
    const conflicts = []; let filled = 0;
    for (const row of loaded) {
      const mine = index.get(row.review_id);
      if (!mine) throw new Error("unknown review ID " + row.review_id);
      for (const c of IMMUTABLE) if (row[c] !== mine[c]) throw new Error(row.review_id + ": inputs or raw response were altered (" + c + ")");
      const annotated = r => r.rating_status !== "pending" || r.second_review_json !== "null" || r.adjudication_json !== "null" ||
        AXES.some(a => r[a] !== "" && r[a] !== "N/A");
      const same = Object.keys(mine).every(c => mine[c] === row[c]);
      if (same || !annotated(row)) continue;
      if (annotated(mine)) { conflicts.push(row.review_id); continue; }
      Object.assign(mine, row); filled++;
    }
    return { filled, conflicts };
  }

  function localIso(date) {
    const pad = n => String(Math.floor(Math.abs(n))).padStart(2, "0");
    const offset = -date.getTimezoneOffset();
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + "T" +
      pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds()) +
      (offset >= 0 ? "+" : "-") + pad(offset / 60) + ":" + pad(offset % 60);
  }

  function problems(row) {
    const found = [], applicable = JSON.parse(row.applicability_json);
    for (const axis of AXES) {
      const score = row[axis], reason = row[axis + "_reason"].trim();
      if (!applicable[axis]) { if (score !== "N/A" || !reason) found.push(axis + ": N/A with a reason"); continue; }
      if (!["0", "1", "2"].includes(score)) found.push(axis + ": score 0, 1 or 2");
      else if (!reason) found.push(axis + ": reason");
    }
    return found;
  }

  function sensitive(row) {
    let flags = [];
    try { flags = JSON.parse(row.sensitivity_flags || "[]"); } catch (e) { flags = []; }
    return flags.length > 0 || row.factuality === "0" || row.factuality === "1";
  }

  globalThis.BoxBoxReview = { AXES, IMMUTABLE, parseCSV, toCSV, records, merge, localIso, problems, sensitive };
})();
</script>

<script>
(function () {
  "use strict";
  const R = globalThis.BoxBoxReview;
  const DATA = JSON.parse(document.getElementById("boxbox-data").textContent);
  const ROWS = DATA.rows, COLUMNS = DATA.columns, KEY = "boxbox-43:" + DATA.sheet_sha256;
  const SUGGEST = DATA.suggestions || {};
  const RUBRIC = {
    correctness: ["Wrong/missing CALL, unusable answer, or a decisive false/unsupported WHY even with the right label",
      "Right CALL, vague/incomplete/partly off-target explanation, no decisive contradiction",
      "Right CALL and sufficient, relevant, supported explanation, including the required limit/correction"],
    role_format: ["No usable answer/label, abandons the role, fulfils a prohibited request, or guarantees optimal strategy",
      "Understandable answer with a minor breach: extra commentary, two sentences, unclear English, ambiguous limits",
      "Exact two-line structure, one clear English WHY sentence, correct constrained role"],
    history: ["Ignores the referent, repeats a false old value, transfers facts from another card, or no usable response",
      "Keeps the topic but misses part of the requested contrast/correction without asserting the false claim",
      "Resolves the referent and handles the required contrast/correction using the current card"],
    scope: ["Attempts/provides the prohibited capability, or no usable refusal",
      "NO CALL but only says it cannot help, vague boundary, or omits the requested explanation of the limit",
      "NO CALL, names the unsupported capability and explains the card/product limit"],
    factuality: ["Invented/contradictory measurement, unauthorised external fact, false policy assertion, optimality guarantee, or empty answer",
      "Decisive facts supported, but a non-decisive hedge or assurance is not verifiable",
      "Every factual claim supported or derived, uncertainty respected, no unsupported assurance"],
  };
  const $ = id => document.getElementById(id);
  let current = 0;

  function store(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }
  function save() {
    const edits = {};
    for (const r of ROWS) edits[r.review_id] = Object.fromEntries(COLUMNS.filter(c => !R.IMMUTABLE.includes(c)).map(c => [c, r[c]]));
    store(() => localStorage.setItem(KEY, JSON.stringify(edits)));
    renderList(); renderProgress();
  }
  function restore() {
    const edits = store(() => JSON.parse(localStorage.getItem(KEY) || "null"), null);
    if (!edits) return 0;
    let n = 0;
    for (const r of ROWS) if (edits[r.review_id]) { Object.assign(r, edits[r.review_id]); n++; }
    return n;
  }
  function notice(text, kind) { $("notice").innerHTML = text ? '<div class="msg ' + (kind || "info") + '">' + esc(text) + "</div>" : ""; }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function visible(text) {
    return esc(text).replace(/\r/g, '<span class="ws">␍</span>').replace(/\n/g, '<span class="ws">⏎</span>\n')
      .replace(/ +$/gm, m => '<span class="ws">' + "·".repeat(m.length) + "</span>");
  }
  function flatten(obj, prefix, out) {
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, prefix + k + ".", out); else out.push([prefix + k, v]);
    }
    return out;
  }
  function kv(obj) {
    return '<table class="kv">' + flatten(obj, "", []).map(([k, v]) => "<tr><td>" + esc(k) + "</td><td>" +
      esc(v === null ? "null" : Array.isArray(v) ? v.join(" | ") : v) + "</td></tr>").join("") + "</table>";
  }
  function status(r) { return r.rating_status === "completed" ? "completed" : R.AXES.some(a => r[a] !== "" && r[a] !== "N/A") ? "draft" : "pending"; }

  function shown() {
    const f = $("filter").value, q = $("search").value.trim().toLowerCase();
    return ROWS.map((r, i) => [r, i]).filter(([r]) =>
      (f === "all" || (f === "pending" && r.rating_status !== "completed") || (f === "completed" && r.rating_status === "completed") ||
       (f === "sensitive" && r.rating_status === "completed" && R.sensitive(r))) &&
      (!q || r.case_id.toLowerCase().includes(q) || r.review_id.toLowerCase().includes(q)));
  }
  function renderList() {
    $("list").innerHTML = shown().map(([r, i]) => '<li data-i="' + i + '" class="' + (i === current ? "active" : "") + '"><span class="dot ' +
      status(r) + (r.rating_status === "completed" && R.sensitive(r) ? " flag" : "") + '"></span><span>' + esc(r.review_id) + " · " +
      esc(r.version_code) + "</span><small>" + esc(r.case_id.replace(/^eval:1\.1\.0:final:/, "")) + "</small></li>").join("");
  }
  function renderProgress() {
    const done = ROWS.filter(r => r.rating_status === "completed").length;
    $("progress").textContent = done + " / " + ROWS.length + " completed";
  }

  function render() {
    // Keep numbers as written (1.0 stays 1.0) where the browser exposes the JSON source text.
    const exact = text => JSON.parse(text, (k, v, ctx) => typeof v === "number" && ctx && ctx.source ? ctx.source : v);
    const r = ROWS[current], app = JSON.parse(r.applicability_json), ref = exact(r.reference_json);
    const history = JSON.parse(r.history_json), card = exact(r.card_json), second = JSON.parse(r.second_review_json);
    const decision = JSON.parse(r.adjudication_json), mode = $("mode").value, locked = mode === "second";
    const flags = store(() => JSON.parse(r.sensitivity_flags || "[]"), []);
    const sug = SUGGEST[r.review_id];
    let html = '<div class="box"><b>' + esc(r.review_id) + "</b> · version " + esc(r.version_code) + " · " + esc(r.case_id) +
      " · turn " + esc(r.turn_index) + ' · <span class="status">' + esc(r.rating_status) + "</span>" +
      (r.rater_id ? " by " + esc(r.rater_id) + " at " + esc(r.rated_at) : "") +
      ' <button id="prev">◀ Prev</button> <button id="next">Next ▶</button></div>';
    html += '<div class="grid"><div><div class="box"><h2>Race card</h2>' + kv(card) + "</div></div><div>";
    html += '<div class="box"><h2>History</h2>' + (history.length ? history.map(t => '<div class="turn"><b>' + esc(t.role) +
      ":</b><pre>" + esc(t.content) + "</pre></div>").join("") : "<i>No prior turns</i>") + "</div>";
    html += '<div class="box"><h2>Current message</h2><pre>' + esc(r.message) + "</pre></div>";
    html += '<div class="box"><h2>Response under review (' + esc(r.generation_status) + ')</h2><pre>' + visible(r.raw_response) +
      "</pre>" + (r.error_json !== "null" ? "<pre>" + esc(r.error_json) + "</pre>" : "") + "</div>";
    html += '<div class="box"><h2>Reference</h2>' + kv(ref) + "</div></div></div>";

    html += '<div class="box"><h2>Primary rating' + (locked ? " (read-only in second-review mode)" : "") + "</h2>";
    if (sug && !locked) html += '<div class="suggest">A suggestion is available for this row. <button id="apply">Apply suggestion</button> — read it, correct it, then mark completed.</div>';
    for (const axis of R.AXES) {
      html += '<div class="axis"><div class="head"><b>' + axis + "</b>";
      if (!app[axis]) html += '<span>N/A (not applicable to this target)</span>';
      else html += '<span class="scores">' + ["0", "1", "2"].map(s => '<label><input type="radio" name="s-' + axis + '" value="' + s + '"' +
        (r[axis] === s ? " checked" : "") + (locked ? " disabled" : "") + "> " + s + "</label>").join("") + "</span>";
      html += "</div>";
      if (app[axis]) html += '<div class="rubric">' + RUBRIC[axis].map((t, k) => k + ": " + esc(t)).join("<br>") + "</div>";
      if (sug && sug.scores[axis] !== undefined && !locked) html += '<div class="suggest">Suggested ' + esc(sug.scores[axis]) + ": " + esc(sug.reasons[axis] || "") + "</div>";
      html += '<textarea data-reason="' + axis + '"' + (locked ? " disabled" : "") + ' placeholder="Short evidence-based reason">' + esc(r[axis + "_reason"]) + "</textarea></div>";
    }
    html += '<div class="flags"><h2>Flags for a second review</h2>' + DATA.flags.map(f => '<label><input type="checkbox" data-flag="' + f + '"' +
      (flags.includes(f) ? " checked" : "") + (locked ? " disabled" : "") + "> " + f.replace(/_/g, " ") + "</label>").join("") +
      "<div class='rubric'>Factuality 0 or 1 always needs a second review.</div></div>";
    if (!locked) html += '<p><button class="primary" id="complete">Mark completed</button> <button id="reopen">Back to pending</button></p>';
    html += "</div>";

    if (r.rating_status === "completed") {
      html += '<div class="box"><h2>Second review (another teammate)</h2>';
      if (second) html += "<pre>" + esc(JSON.stringify(second, null, 2)) + "</pre>";
      if (locked) {
        html += '<label>Verdict <select id="verdict"><option value="agrees">agrees</option><option value="disagrees">disagrees</option><option value="unsure">unsure</option></select></label>';
        html += R.AXES.map(a => '<div>' + a + ": " + (app[a] ? ["", "0", "1", "2"].map(s => '<label><input type="radio" name="t-' + a + '" value="' + s + '"' +
          (s === "" ? " checked" : "") + "> " + (s || "no score") + "</label> ").join("") : "N/A") + "</div>").join("");
        html += '<textarea id="second-notes" placeholder="Independent notes"></textarea><p><button class="primary" id="save-second">Save second review</button></p>';
      }
      html += "</div>";
      if (second) {
        html += '<div class="box"><h2>Resolution</h2>' + (decision ? "<pre>" + esc(JSON.stringify(decision, null, 2)) + "</pre>" : "");
        if (locked) html += '<label>Participants <input type="text" id="participants" size="40" placeholder="Comma-separated real names"></label> ' +
          '<label>Status <select id="res-status"><option value="resolved">resolved</option><option value="unresolved">unresolved</option></select></label>' +
          '<textarea id="decision" placeholder="Decision (e.g. keep primary scores; or the agreed corrected scores)"></textarea>' +
          '<textarea id="res-reason" placeholder="Reason"></textarea><p><button class="primary" id="save-res">Save resolution</button></p>';
        html += "</div>";
      }
    }
    $("view").innerHTML = html;
    wire(r, app);
  }

  function touch(r) {
    if (r.rating_status === "completed") { r.rating_status = "pending"; r.rater_id = ""; r.rated_at = ""; notice(r.review_id + " was edited and is pending again; mark it completed when done."); }
  }
  function wire(r, app) {
    $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
    document.querySelectorAll('input[type=radio][name^="s-"]').forEach(el => el.onchange = () => { touch(r); r[el.name.slice(2)] = el.value; save(); render(); });
    document.querySelectorAll("textarea[data-reason]").forEach(el => el.onchange = () => { touch(r); r[el.dataset.reason + "_reason"] = el.value; save(); });
    document.querySelectorAll("input[data-flag]").forEach(el => el.onchange = () => {
      touch(r);
      const flags = [...document.querySelectorAll("input[data-flag]:checked")].map(x => x.dataset.flag);
      r.sensitivity_flags = flags.length ? JSON.stringify(flags) : ""; save(); render();
    });
    if ($("apply")) $("apply").onclick = () => {
      const s = SUGGEST[r.review_id]; touch(r);
      for (const a of R.AXES) if (app[a] && s.scores[a] !== undefined) { r[a] = String(s.scores[a]); r[a + "_reason"] = s.reasons[a] || ""; }
      if (s.flags && s.flags.length) r.sensitivity_flags = JSON.stringify(s.flags);
      save(); render();
    };
    if ($("complete")) $("complete").onclick = () => {
      const name = $("rater").value.trim();
      if (!name) return notice("Enter your name/ID at the top first.", "error");
      const missing = R.problems(r);
      if (missing.length) return notice("Missing: " + missing.join("; "), "error");
      const other = ROWS.find(x => x.case_id === r.case_id && x.rating_status === "completed" && x.rater_id !== name);
      if (other) return notice("All versions of " + r.case_id + " must keep the same primary rater (" + other.rater_id + ").", "error");
      r.rating_status = "completed"; r.rater_id = name; r.rated_at = R.localIso(new Date());
      notice(""); save(); go(1);
    };
    if ($("reopen")) $("reopen").onclick = () => { r.rating_status = "pending"; r.rater_id = ""; r.rated_at = ""; save(); render(); };
    if ($("save-second")) $("save-second").onclick = () => {
      const name = $("rater").value.trim(), notes = $("second-notes").value.trim();
      if (!name) return notice("Enter your name/ID at the top first.", "error");
      if (name === r.rater_id) return notice("The second review must come from another teammate.", "error");
      if (!notes) return notice("Second review notes are required.", "error");
      const scores = {};
      for (const a of R.AXES) { const el = document.querySelector('input[name="t-' + a + '"]:checked'); if (app[a] && el && el.value !== "") scores[a] = Number(el.value); }
      r.second_review_json = JSON.stringify({ reviewer_id: name, reviewed_at: R.localIso(new Date()), verdict: $("verdict").value, scores, notes });
      notice(""); save(); render();
    };
    if ($("save-res")) $("save-res").onclick = () => {
      const people = $("participants").value.split(",").map(s => s.trim()).filter(Boolean), reason = $("res-reason").value.trim();
      if (!people.length || !reason) return notice("A resolution needs its real participants and a reason.", "error");
      r.adjudication_json = JSON.stringify({ participants: people, decided_at: R.localIso(new Date()), status: $("res-status").value,
        decision: $("decision").value.trim(), reason });
      notice(""); save(); render();
    };
  }
  function go(step) {
    const order = shown().map(([, i]) => i), at = order.indexOf(current);
    if (order.length) current = order[Math.min(order.length - 1, Math.max(0, at < 0 ? 0 : at + step))];
    renderList(); render(); window.scrollTo(0, 0);
  }

  $("list").onclick = e => { const li = e.target.closest("li"); if (li) { current = Number(li.dataset.i); renderList(); render(); window.scrollTo(0, 0); } };
  $("filter").onchange = () => { renderList(); }; $("search").oninput = () => renderList();
  $("mode").onchange = () => render();
  $("rater").value = store(() => localStorage.getItem("boxbox-43:rater") || "", "");
  $("rater").onchange = () => store(() => localStorage.setItem("boxbox-43:rater", $("rater").value.trim()));
  $("export").onclick = () => {
    const blob = new Blob([R.toCSV(COLUMNS, ROWS)], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"), stamp = R.localIso(new Date()).slice(0, 19).replace(/[-:]/g, "").replace("T", "-");
    a.href = URL.createObjectURL(blob); a.download = "review-rated-" + stamp + ".csv"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("load").onclick = () => $("file").click();
  $("file").onchange = async () => {
    const f = $("file").files[0]; if (!f) return;
    try {
      const result = R.merge(ROWS, R.records(COLUMNS, await f.text()));
      save(); render();
      notice("Loaded " + f.name + ": " + result.filled + " rows filled" + (result.conflicts.length ? "; kept local notes for conflicting rows " + result.conflicts.join(", ") : "") + ".",
        result.conflicts.length ? "error" : "info");
    } catch (e) { notice("Not loaded: " + e.message, "error"); }
    $("file").value = "";
  };
  document.addEventListener("keydown", e => {
    if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
    if (e.key === "j" || e.key === "ArrowRight") go(1); if (e.key === "k" || e.key === "ArrowLeft") go(-1);
  });
  const restored = restore();
  notice((restored ? "Restored your edits from this browser. " : "") + "Edits are kept in this browser only: export the CSV regularly. Sheet " +
    DATA.sheet_name + " (" + DATA.sheet_sha256.slice(0, 12) + "…).");
  renderList(); renderProgress(); render();
})();
</script>
</body>
</html>
